name: Build OrangeFox Recovery
on:
  workflow_dispatch:
jobs:
  build:
    name: Build OFOX
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: OrangeFox Build
        uses: UWU-TEAM/UWU-OrangeFox-Builder@v1.0.0
        with:
          USER_NAME: "Builder"
          USER_EMAIL: "builder@example.com"
          DEVICE_TREE: "https://github.com/yuksekberk034-droid/8492A-Orangefox-workplace"
          DEVICE_TREE_BRANCH: "main"
          DEVICE_PATH: "device/tcl/8492A"
          DEVICE_NAME: "8492A"
          BUILD_TARGET: "boot"
          MAINTAINER_AVATAR: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
